[project]
name = "strictroute"
version = "0.1.0"
description = "A strict-by-default URL path router with a thin CLI on top"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tidal-vane82" }]

[project.scripts]
strictroute = "strictroute.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
